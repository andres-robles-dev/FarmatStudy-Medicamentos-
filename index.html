<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FarmaStudy - Plataforma de Estudio Farmacológico</title>
  <link rel="icon" type="image/svg+xml" href="/iconos/favicon.svg" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="estilo/principal.css" />
  <link rel="stylesheet" href="estilo/componentes.css" />
  <link rel="stylesheet" href="estilo/explorador.css" />
  <link rel="stylesheet" href="estilo/estudio.css" />
</head>
<body>
  <div id="app">
    <!-- CABECERA -->
    <header id="cabecera" class="cabecera">
      <div class="cabecera__izquierda">
        <button id="boton-menu" class="cabecera__boton-menu" title="Menú">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="cabecera__logo material-symbols-outlined">menu_book</span>
        <span id="titulo-modulo" class="cabecera__titulo">FarmaStudy</span>
      </div>
      <div class="cabecera__centro">
        <div class="buscador-rapido">
          <span class="buscador-rapido__icono material-symbols-outlined">search</span>
          <input type="text" id="busqueda-rapida" class="buscador-rapido__input" placeholder="Buscar medicamento, principio activo, laboratorio..." />
        </div>
      </div>
      <div class="cabecera__derecha">
        <span class="cabecera__contador" id="contador-medicamentos">0 medicamentos</span>
      </div>
    </header>

    <!-- CUERPO -->
    <div id="cuerpo" class="cuerpo">
      <!-- MENÚ LATERAL -->
      <nav id="menu-lateral" class="menu">
        <div class="menu__grupo">
          <span class="menu__etiqueta">ESTUDIO</span>
          <button class="menu__item menu__item--activo" data-modulo="explorador" title="Explorar por clasificación ATC">
            <span class="menu__icono material-symbols-outlined">account_tree</span>
            <span class="menu__texto">Explorador ATC</span>
          </button>
          <button class="menu__item" data-modulo="buscador" title="Búsqueda global de medicamentos">
            <span class="menu__icono material-symbols-outlined">search</span>
            <span class="menu__texto">Buscador</span>
          </button>
          <button class="menu__item" data-modulo="flashcards" title="Modo estudio con tarjetas">
            <span class="menu__icono material-symbols-outlined">style</span>
            <span class="menu__texto">Flashcards</span>
          </button>
          <button class="menu__item" data-modulo="test" title="Ponte a prueba con tests">
            <span class="menu__icono material-symbols-outlined">edit_note</span>
            <span class="menu__texto">Test</span>
          </button>
        </div>
        <div class="menu__grupo">
          <span class="menu__etiqueta">CONSULTA</span>
          <button class="menu__item" data-modulo="laboratorios" title="Laboratorios farmacéuticos">
            <span class="menu__icono material-symbols-outlined">business</span>
            <span class="menu__texto">Laboratorios</span>
          </button>
          <button class="menu__item" data-modulo="ficha" title="Ficha del medicamento activo">
            <span class="menu__icono material-symbols-outlined">description</span>
            <span class="menu__texto">Ficha detalle</span>
          </button>
        </div>
        <div class="menu__grupo">
          <span class="menu__etiqueta">INFORMACIÓN</span>
          <button class="menu__item" data-modulo="acerca" title="Acerca de FarmaStudy">
            <span class="menu__icono material-symbols-outlined">info</span>
            <span class="menu__texto">Acerca de</span>
          </button>
        </div>
      </nav>

      <!-- ÁREA DE TRABAJO -->
      <main id="area-trabajo" class="area-trabajo">
      </main>
    </div>

    <!-- BARRA DE ESTADO -->
    <footer id="barra-estado" class="barra-estado">
      <span id="estado-texto" class="barra-estado__texto">Listo</span>
      <span class="barra-estado__texto">FarmaStudy v1.0</span>
    </footer>
  </div>

  <!-- SCRIPTS -->
  <script type="module" src="js/nucleo/estado.js"></script>
  <script type="module" src="js/nucleo/utilidades.js"></script>
  <script type="module" src="js/nucleo/enrutador.js"></script>
  <script type="module" src="datos/medicamentos.js"></script>
  <script type="module" src="datos/laboratorios.js"></script>
  <script type="module" src="datos/clasificacion-atc.js"></script>
  <script type="module" src="js/modulos/modulo-explorador.js"></script>
  <script type="module" src="js/modulos/modulo-ficha.js"></script>
  <script type="module" src="js/modulos/modulo-buscador.js"></script>
  <script type="module" src="js/modulos/modulo-flashcards.js"></script>
  <script type="module" src="js/modulos/modulo-test.js"></script>
  <script type="module" src="js/modulos/modulo-laboratorios.js"></script>
  <script type="module" src="js/modulos/modulo-acerca.js"></script>
  <script type="module" src="js/principal.js"></script>
</body>
</html>
